<!DOCTYPE html>
<html>
<head>
  <title>Candidate Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #070c14;
  color: #e2eaf5;
  font-family: 'Inter', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 24px;
  position: relative;
  overflow-x: hidden;
}

/* Radial glow */
body::before {
  content: '';
  position: fixed;
  top: -200px; left: 50%;
  transform: translateX(-50%);
  width: 900px; height: 500px;
  background: radial-gradient(ellipse, rgba(56,189,248,0.07) 0%, transparent 70%);
  pointer-events: none;
}

.container {
  width: 100%;
  max-width: 480px;
  background: #111d2e;
  padding: 36px 32px 32px;
  border-radius: 18px;
  border: 1px solid rgba(100,160,255,0.10);
  box-shadow: 0 4px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(56,189,248,0.06);
  position: relative;
  z-index: 1;
}

/* Top accent bar */
.container::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, #38bdf8, transparent);
  border-radius: 18px 18px 0 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.logo svg { color: #38bdf8; }

.logo-text {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 700;
  color: #e2eaf5;
}

h2 {
  font-family: 'Syne', sans-serif;
  font-size: 26px;
  font-weight: 800;
  color: #e2eaf5;
  margin-bottom: 4px;
  letter-spacing: -0.5px;
}

.subtitle {
  font-size: 13px;
  color: #4d6480;
  margin-bottom: 28px;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.3px;
}

.field { margin-bottom: 18px; }

label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #8ba0bb;
  display: block;
  margin-bottom: 7px;
  font-family: 'IBM Plex Mono', monospace;
}

input, textarea {
  width: 100%;
  padding: 11px 14px;
  background: #0d1624;
  border: 1px solid rgba(100,160,255,0.12);
  color: #e2eaf5;
  border-radius: 10px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
  resize: vertical;
}

input:focus, textarea:focus {
  border-color: rgba(56,189,248,0.45);
  box-shadow: 0 0 0 3px rgba(56,189,248,0.08);
}

input::placeholder, textarea::placeholder { color: #2e4056; }

.error {
  color: #f87171;
  font-size: 11px;
  margin-top: 5px;
  display: none;
  font-family: 'IBM Plex Mono', monospace;
}
.error.visible { display: block; }

button[type="submit"] {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #0ea5e9, #38bdf8);
  border: none;
  color: #07131f;
  font-weight: 700;
  cursor: pointer;
  border-radius: 10px;
  font-size: 15px;
  font-family: 'Syne', sans-serif;
  letter-spacing: 0.3px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  margin-top: 4px;
  box-shadow: 0 4px 16px rgba(56,189,248,0.2);
}

button[type="submit"]:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(56,189,248,0.3);
}
button[type="submit"]:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* Spinner inside button */
.spinner {
  display: inline-block;
  width: 15px; height: 15px;
  border: 2px solid rgba(7,19,31,0.4);
  border-top-color: #07131f;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
  margin-right: 7px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Redirect notice */
.redirect-box {
  display: none;
  margin-top: 20px;
  padding: 16px 18px;
  background: rgba(52,211,153,0.07);
  border: 1px solid rgba(52,211,153,0.25);
  border-radius: 10px;
  text-align: center;
}
.redirect-box.visible { display: block; }

.redirect-box .tick {
  font-size: 28px;
  margin-bottom: 8px;
  display: block;
}
.redirect-box h3 {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #34d399;
  margin-bottom: 4px;
}
.redirect-box p {
  font-size: 12px;
  color: #4d6480;
  font-family: 'IBM Plex Mono', monospace;
}
.redirect-bar-wrap {
  margin-top: 12px;
  height: 3px;
  background: rgba(52,211,153,0.12);
  border-radius: 3px;
  overflow: hidden;
}
.redirect-bar {
  height: 100%;
  background: #34d399;
  border-radius: 3px;
  width: 0%;
  transition: width 2.5s linear;
}

/* Error box */
.api-error {
  display: none;
  margin-top: 18px;
  padding: 14px 16px;
  background: rgba(248,113,113,0.07);
  border: 1px solid rgba(248,113,113,0.25);
  border-radius: 10px;
  font-size: 12px;
  color: #fca5a5;
  font-family: 'IBM Plex Mono', monospace;
  line-height: 1.6;
}
.api-error.visible { display: block; }
.api-error code {
  background: rgba(248,113,113,0.1);
  padding: 1px 5px;
  border-radius: 4px;
}

@media (max-width: 500px) {
  .container { padding: 24px 18px 22px; }
  h2 { font-size: 22px; }
}
</style>
</head>
<body>

<div class="container">

  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M12 2L21.5 7.5V16.5L12 22L2.5 16.5V7.5L12 2Z" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="3" fill="currentColor"/>
    </svg>
    <span class="logo-text">InterviewAI</span>
  </div>

  <h2>Candidate Registration</h2>
  <p class="subtitle">// fill in your details to begin</p>

  <form id="registerForm">

    <div class="field">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Jane Doe">
      <span class="error" id="nameError">Name must be at least 2 characters</span>
    </div>

    <div class="field">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="jane@example.com">
      <span class="error" id="emailError">Enter a valid email address</span>
    </div>

    <div class="field">
      <label>Your Qualifications</label>
      <textarea id="qualification" rows="3"
        placeholder="e.g. B.Tech in Computer Science, 3 years experience in Python, AWS certified…"></textarea>
      <span class="error" id="qualificationError">Qualification is required</span>
    </div>

    <div class="field">
      <label>Job Description</label>
      <textarea id="jobDescription" rows="4"
        placeholder="e.g. We are looking for a backend developer with FastAPI, PostgreSQL, and REST API experience…"></textarea>
      <span class="error" id="jobError">Minimum 10 characters required</span>
    </div>

    <button type="submit" id="submitBtn">
      Register &amp; Generate Interview Questions
    </button>

  </form>

  <!-- Redirect success notice -->
  <div class="redirect-box" id="redirectBox">
    <span class="tick">✅</span>
    <h3>Registration Successful!</h3>
    <p>AI questions generated. Redirecting to your interview…</p>
    <div class="redirect-bar-wrap">
      <div class="redirect-bar" id="redirectBar"></div>
    </div>
  </div>

  <!-- API / network error -->
  <div class="api-error" id="apiError"></div>

</div>

<script>
const BACKEND_URL = window.BACKEND_URL || "http://127.0.0.1:8000";

function showFieldError(id, show) {
  document.getElementById(id).classList.toggle('visible', show);
}

function clearErrors() {
  document.querySelectorAll('.error').forEach(e => e.classList.remove('visible'));
}

function setLoading(on) {
  const btn = document.getElementById('submitBtn');
  btn.disabled = on;
  btn.innerHTML = on
    ? '<span class="spinner"></span>Generating Questions…'
    : 'Register &amp; Generate Interview Questions';
}

document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  clearErrors();
  document.getElementById('apiError').classList.remove('visible');

  const name    = document.getElementById('name').value.trim();
  const email   = document.getElementById('email').value.trim().toLowerCase();
  const qual    = document.getElementById('qualification').value.trim();
  const jobDesc = document.getElementById('jobDescription').value.trim();

  let valid = true;
  if (name.length < 2)                                    { showFieldError('nameError', true); valid = false; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))         { showFieldError('emailError', true); valid = false; }
  if (qual.length < 5)                                    { showFieldError('qualificationError', true); valid = false; }
  if (jobDesc.length < 10)                                { showFieldError('jobError', true); valid = false; }
  if (!valid) return;

  setLoading(true);

  try {
    const res = await fetch(`${BACKEND_URL}/generate-questions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        email,
        qualification:   qual,
        job_description: jobDesc
      })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `Server error ${res.status}`);
    }

    const data = await res.json();
    if (data.generation_method !== 'ai-ollama') {
      throw new Error(data.warning || 'Ollama could not generate questions. Check that Ollama is running and OLLAMA_MODEL names an installed model, then try again.');
    }

    // ── Persist candidate info so interview.html can pick it up ──
    sessionStorage.setItem('candidateEmail', email);
    sessionStorage.setItem('candidateName',  name);
    sessionStorage.setItem('generatedQuestions', JSON.stringify(data.questions || []));

    // ── Show redirect countdown ──
    this.style.display = 'none';
    const box = document.getElementById('redirectBox');
    box.classList.add('visible');

    // Animate progress bar then redirect
    requestAnimationFrame(() => {
      document.getElementById('redirectBar').style.width = '100%';
    });

    setTimeout(() => {
      window.location.href = 'interview.html';
    }, 2700);

  } catch (err) {
    const errBox = document.getElementById('apiError');
    errBox.classList.add('visible');
    const hint = err instanceof TypeError ? ` Check that the backend is running at ${BACKEND_URL}.` : '';
    errBox.textContent = `Error: ${err.message}${hint}`;
    setLoading(false);
  }
});
</script>

</body>
</html>
