<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview Report · InterviewAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:         #070c14;
      --surface:    #0d1624;
      --card:       #111d2e;
      --border:     rgba(100,160,255,0.10);
      --border-hi:  rgba(100,160,255,0.22);
      --accent:     #38bdf8;
      --green:      #34d399;
      --yellow:     #fbbf24;
      --red:        #f87171;
      --purple:     #a78bfa;
      --cyan:       #22d3ee;
      --orange:     #fb923c;
      --text:       #e2eaf5;
      --sub:        #8ba0bb;
      --dim:        #4d6480;
      --mono:       'IBM Plex Mono', monospace;
      --display:    'Syne', sans-serif;
      --body:       'Inter', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--body); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    body::before { content: ''; position: fixed; top: -180px; left: 50%; transform: translateX(-50%); width: 900px; height: 500px; background: radial-gradient(ellipse, rgba(56,189,248,0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }
    body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.022; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size: 128px; }

    .header { position: sticky; top: 0; z-index: 100; background: rgba(7,12,20,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 14px 24px; }
    .header-inner { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .logo { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--text); }
    .logo svg { color: var(--accent); }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 8px; font-family: var(--display); font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; text-decoration: none; }
    .btn:hover { transform: translateY(-1px); }
    .btn-outline { background: transparent; border-color: var(--border-hi); color: var(--sub); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: linear-gradient(135deg, #0ea5e9, #38bdf8); color: #07131f; box-shadow: 0 4px 14px rgba(56,189,248,0.2); }

    main { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; padding: 52px 24px 100px; }

    .report-hero { margin-bottom: 48px; padding-bottom: 36px; border-bottom: 1px solid var(--border); }
    .report-tag { font-family: var(--mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; opacity: 0.8; }
    .report-hero h1 { font-family: var(--display); font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin-bottom: 10px; }
    .report-hero h1 em { font-style: normal; color: var(--accent); }
    .candidate-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
    .meta-pill { font-family: var(--mono); font-size: 11px; padding: 4px 12px; border-radius: 100px; background: rgba(56,189,248,0.07); border: 1px solid rgba(56,189,248,0.18); color: var(--accent); letter-spacing: 0.5px; }

    .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 36px; }
    .score-tile { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; border-top: 3px solid var(--accent); transition: border-color 0.2s; }
    .score-tile:hover { border-color: var(--border-hi); }
    .tile-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
    .tile-value { font-size: 28px; font-weight: 800; line-height: 1; margin-bottom: 8px; }
    .tile-bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,0.06); overflow: hidden; margin-bottom: 8px; }
    .tile-bar-fill { height: 100%; border-radius: 4px; transition: width 1.2s cubic-bezier(0.16,1,0.3,1); }
    .tile-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 100px; letter-spacing: 0.8px; }

    .section-title { font-family: var(--display); font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .section-title .line { flex: 1; height: 1px; background: var(--border); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px 26px; margin-bottom: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); animation: fadeUp 0.4s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .card-eyebrow { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .card-accent-blue   { border-top: 2px solid var(--accent); }
    .card-accent-green  { border-top: 2px solid var(--green); }
    .card-accent-yellow { border-top: 2px solid var(--yellow); }
    .card-accent-purple { border-top: 2px solid var(--purple); }
    .card-accent-orange { border-top: 2px solid var(--orange); }

    .answer-item { background: rgba(255,255,255,0.025); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; border-left: 3px solid var(--dim); }
    .answer-q-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
    .answer-q-text { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; line-height: 1.5; }
    .answer-a-text { font-size: 13px; color: var(--sub); font-style: italic; margin-bottom: 12px; line-height: 1.6; }
    .answer-scores { display: flex; flex-wrap: wrap; gap: 6px; }
    .score-chip { font-family: var(--mono); font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 100px; }

    .metric-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .metric-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--sub); vertical-align: top; }
    .metric-table tr:last-child td { border-bottom: none; }
    .metric-table tr:nth-child(even) td { background: rgba(255,255,255,0.015); }
    .metric-icon { font-size: 15px; }
    .metric-label { font-size: 13px; color: rgba(255,255,255,0.75); }
    .metric-value { font-family: var(--mono); font-weight: 700; font-size: 14px; text-align: right; white-space: nowrap; }
    .metric-interp { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.5; }

    .section-block { margin-bottom: 14px; border-radius: 0 10px 10px 0; border-left: 3px solid var(--accent); background: rgba(255,255,255,0.025); padding: 14px 16px; }
    .section-block-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .section-block-body { font-size: 13px; line-height: 1.75; color: rgba(255,255,255,0.72); }

    .bullet-list { list-style: none; padding: 0; margin: 0; }
    .bullet-list li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; line-height: 1.6; color: rgba(255,255,255,0.68); }
    .bullet-list li:last-child { border-bottom: none; }
    .bullet-list li::before { content: '›'; color: rgba(255,255,255,0.25); flex-shrink: 0; }

    /* ── Video section specific ── */
    .video-metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .video-metric-tile { border-radius: 12px; padding: 16px 18px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
    .video-metric-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
    .video-metric-value { font-size: 26px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
    .video-metric-bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,0.05); overflow: hidden; margin-bottom: 8px; }
    .video-metric-bar-fill { height: 100%; border-radius: 3px; transition: width 1.2s cubic-bezier(0.16,1,0.3,1); }
    .video-metric-hint { font-size: 11px; color: var(--dim); margin-top: 6px; }

    .video-insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; margin-top: 20px; }
    .video-insight-block { border-radius: 10px; padding: 16px 18px; }
    .video-insight-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }

    .growth-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .growth-tile { padding: 16px 18px; border-radius: 12px; font-size: 12px; line-height: 1.7; color: rgba(255,255,255,0.6); }
    .growth-tile-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .encourage-box { padding: 18px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); text-align: center; font-size: 13px; line-height: 1.8; color: rgba(255,255,255,0.5); }

    .overall-badge { text-align: center; padding: 14px 22px; border-radius: 12px; display: inline-block; }
    .overall-score { font-size: 42px; font-weight: 800; line-height: 1; }
    .overall-label { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }
    .overall-text  { font-size: 12px; font-weight: 700; margin-top: 6px; }

    .empty-state { text-align: center; padding: 80px 24px; }
    .empty-state h2 { font-family: var(--display); font-size: 24px; margin-bottom: 12px; }
    .empty-state p  { color: var(--sub); font-size: 14px; margin-bottom: 24px; }

    @media print { .header, .header-actions, .btn { display: none !important; } body { background: white; color: black; } }
    @media (max-width: 600px) { main { padding: 28px 16px 60px; } .report-hero h1 { font-size: 1.8rem; } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(100,160,255,0.15); border-radius: 3px; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L21.5 7.5V16.5L12 22L2.5 16.5V7.5L12 2Z" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="3" fill="currentColor"/>
      </svg>
      InterviewAI
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn btn-outline">← Retake Interview</a>
      <button class="btn btn-outline" onclick="window.print()">🖨 Print Report</button>
      <a href="register.html" class="btn btn-primary">New Candidate</a>
    </div>
  </div>
</header>

<main id="reportMain">
  <div class="empty-state">
    <h2>Preparing your report…</h2>
    <p>Loading interview data from your session.</p>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════
// LOAD DATA
// ═══════════════════════════════════════════════════
var answers        = JSON.parse(sessionStorage.getItem('interviewAnswers') || '[]');
var totalQuestions = parseInt(sessionStorage.getItem('totalQuestions') || '5');
var candidateName  = sessionStorage.getItem('candidateName')  || 'Candidate';
var candidateEmail = sessionStorage.getItem('candidateEmail') || '—';

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function rc(v, max, inv) {
  max = max || 10; inv = inv || false;
  var r = v / max;
  if (inv) return r < 0.05 ? '#34d399' : r < 0.15 ? '#fbbf24' : '#f87171';
  return r >= 0.75 ? '#34d399' : r >= 0.50 ? '#fbbf24' : '#f87171';
}
function badge(v) {
  if (v >= 8.5) return { l:'Excellent',     c:'#34d399' };
  if (v >= 7.0) return { l:'Good',          c:'#6ee7b7' };
  if (v >= 5.5) return { l:'Average',       c:'#fbbf24' };
  if (v >= 4.0) return { l:'Below Average', c:'#fb923c' };
  return               { l:'Needs Work',    c:'#f87171' };
}
function blist(items) {
  if (!items || !items.length) return '<p style="color:rgba(255,255,255,0.3);font-size:13px;margin:0;">None noted.</p>';
  var r = '<ul class="bullet-list">';
  for (var i = 0; i < items.length; i++) r += '<li>' + items[i] + '</li>';
  return r + '</ul>';
}
function secBlock(icon, title, body, color) {
  color = color || '#38bdf8';
  return '<div class="section-block" style="border-left-color:' + color + ';">'
       + '<div class="section-block-title" style="color:' + color + ';">' + icon + ' ' + title + '</div>'
       + '<div class="section-block-body">' + body + '</div>'
       + '</div>';
}
function tile(label, val, max, inv, hint) {
  max = max||10; inv=inv||false; hint=hint||'';
  var color = rc(val,max,inv);
  var pct   = Math.round((val/max)*100);
  var b     = inv
    ? (pct<5?{l:'Excellent',c:'#34d399'}:pct<15?{l:'Moderate',c:'#fbbf24'}:{l:'High',c:'#f87171'})
    : badge(val);
  var disp  = max===10 ? val.toFixed(1)+' / 10' : val.toFixed(1)+'%';
  return '<div class="score-tile" style="border-top-color:'+color+';">'
       + '<div class="tile-label">'+label+'</div>'
       + '<div class="tile-value" style="color:'+color+';">'+disp+'</div>'
       + '<div class="tile-bar"><div class="tile-bar-fill" style="width:'+pct+'%;background:'+color+';"></div></div>'
       + '<span class="tile-badge" style="background:'+b.c+'22;color:'+b.c+';border:1px solid '+b.c+'44;">'+b.l+'</span>'
       + (hint?'<div style="font-size:11px;color:var(--dim);margin-top:6px;">'+hint+'</div>':'')
       + '</div>';
}
function iContent(v){return v>=8?'Score <strong>'+v.toFixed(1)+'/10</strong> — answers were relevant, specific, and addressed questions well.':v>=6?'Score <strong>'+v.toFixed(1)+'/10</strong> — on the right track; more specific examples would strengthen answers.':v>=4?'Score <strong>'+v.toFixed(1)+'/10</strong> — some connection, but answers could be more focused.':'Score <strong>'+v.toFixed(1)+'/10</strong> — answers didn\'t closely address questions. STAR method practice would help.';}
function iTone(v){return v>=8?'Score <strong>'+v.toFixed(1)+'/10</strong> — spoke clearly with good expression; engaged and professional.':v>=6?'Score <strong>'+v.toFixed(1)+'/10</strong> — generally good; varying pace would take this higher.':v>=4?'Score <strong>'+v.toFixed(1)+'/10</strong> — moments of flat or rushed tone. Recording yourself would help.':'Score <strong>'+v.toFixed(1)+'/10</strong> — delivery made the message harder to land. Daily reading aloud builds this skill.';}
function iConf(v){return v>=8?'Score <strong>'+v.toFixed(1)+'/10</strong> — came across assured and composed.':v>=6?'Score <strong>'+v.toFixed(1)+'/10</strong> — reasonably confident; practice makes it more natural.':v>=4?'Score <strong>'+v.toFixed(1)+'/10</strong> — some nervousness showed. Mock interviews fix this.':'Score <strong>'+v.toFixed(1)+'/10</strong> — uncertainty came through. Confidence is a skill — daily practice builds it fast.';}
function iFill(v){return v<3?'<strong>'+v.toFixed(1)+'%</strong> — almost none. Clean, polished speech.':v<8?'<strong>'+v.toFixed(1)+'%</strong> — small number; generally in good shape.':v<15?'<strong>'+v.toFixed(1)+'%</strong> — fillers appeared frequently. Replace with a confident pause.':'<strong>'+v.toFixed(1)+'%</strong> — quite high. Recording and counting fillers reduces them fast.';}
function iFumb(v){return v<2?'<strong>'+v.toFixed(1)+'%</strong> — very clean delivery.':v<5?'<strong>'+v.toFixed(1)+'%</strong> — a few hesitations; normal in live interviews.':'<strong>'+v.toFixed(1)+'%</strong> — noticeable stumbling. Pause 2 s before answering to organise thoughts.';}
function iWords(v){return v>100?'<strong>'+v+' words</strong> — well-developed, detailed answer.':v>50?'<strong>'+v+' words</strong> — reasonable; slightly more detail would help.':v>20?'<strong>'+v+' words</strong> — on the brief side. Expand with examples.':'<strong>'+v+' words</strong> — very short. 60–80 words per answer makes a big difference.';}

// ═══════════════════════════════════════════════════
// AGGREGATE — two INDEPENDENT loops
// ═══════════════════════════════════════════════════
var totC=0,totT=0,totO=0,totCon=0,totFil=0,totFum=0,totW=0;
var allStr=[],allWeak=[],allImpr=[],allComm=[];
var scored=0;

// Loop A: audio/text scores
for (var i=0;i<answers.length;i++) {
  var s = answers[i].ai_score;
  if (!s || s.error) continue;
  totC   += s.content_score    || 0;
  totT   += s.tone_score       || 0;
  totO   += s.overall_score    || 0;
  totCon += s.confidence_score || 0;
  totFil += s.filler_word_rate || 0;
  totFum += s.fumble_rate      || 0;
  totW   += s.word_count       || 0;
  scored++;
  (s.strengths    ||[]).forEach(function(x){if(!allStr.includes(x))  allStr.push(x);});
  (s.weaknesses   ||[]).forEach(function(x){if(!allWeak.includes(x)) allWeak.push(x);});
  (s.improvements ||[]).forEach(function(x){if(!allImpr.includes(x)) allImpr.push(x);});
  if (s.communication_comment) allComm.push(s.communication_comment);
}

// Loop B: video — fully independent, NOT gated on ai_score
var videoAnswers = [];
for (var j=0;j<answers.length;j++) {
  var va = answers[j].video_analysis;
  if (va && !va.error) videoAnswers.push(va);
}

var n    = scored||1;
var avgC = totC/n, avgT=totT/n, avgO=totO/n, avgCon=totCon/n;
var avgFil=totFil/n, avgFum=totFum/n, avgW=Math.round(totW/n);
var ovBadge = badge(avgO);

// ═══════════════════════════════════════════════════
// VIDEO SECTION — standalone function, string concat
// ═══════════════════════════════════════════════════
function buildVideoSection() {
  if (videoAnswers.length === 0) return '';

  var totalEye=0, totalShoulder=0, totalSpine=0, totalFrames=0;
  var confArr=[];
  var allOverall=[], allEyeA=[], allPostA=[];
  var blStr=[], blImp=[], blRec=[];
  var method='rule_based';

  for (var i=0;i<videoAnswers.length;i++) {
    var va = videoAnswers[i];
    var rm = va.raw_metrics  || {};
    var as = va.assessment   || {};

    totalEye      += (rm.eye_contact_rate       || 0);
    totalShoulder += (rm.avg_shoulder_alignment || 0);
    totalSpine    += (rm.avg_spine_angle        || 0);
    totalFrames   += (rm.total_frames           || 0);

    if (typeof as.confidence_projection_score === 'number') confArr.push(as.confidence_projection_score);
    if (as.overall_assessment)    allOverall.push(as.overall_assessment);
    if (as.eye_contact_analysis)  allEyeA.push(as.eye_contact_analysis);
    if (as.posture_analysis)      allPostA.push(as.posture_analysis);
    if (va.analysis_method==='ai') method='ai';

    (as.strengths                  ||[]).forEach(function(x){if(!blStr.includes(x)) blStr.push(x);});
    (as.areas_for_improvement      ||[]).forEach(function(x){if(!blImp.includes(x)) blImp.push(x);});
    (as.improvement_recommendations||[]).forEach(function(x){if(!blRec.includes(x)) blRec.push(x);});
  }

  var cnt  = videoAnswers.length;
  var aEye = totalEye/cnt;
  var aSho = totalShoulder/cnt;
  var aSpi = totalSpine/cnt;
  var aConf = confArr.length ? confArr.reduce(function(a,b){return a+b;},0)/confArr.length : null;

  var eyeC  = aEye>=0.7?'#34d399':aEye>=0.5?'#fbbf24':'#f87171';
  var shoC  = Math.abs(aSho)<5?'#34d399':Math.abs(aSho)<12?'#fbbf24':'#f87171';
  var spiC  = (aSpi>=75&&aSpi<=95)?'#34d399':'#fbbf24';
  var conC  = aConf!==null?(aConf>=7?'#34d399':aConf>=5?'#fbbf24':'#f87171'):'#38bdf8';

  var eyeBadge = aEye>=0.7?'Strong':aEye>=0.5?'Moderate':'Needs Work';
  var shoBadge = Math.abs(aSho)<5?'Well Aligned':'Needs Adjustment';
  var spiBadge = (aSpi>=75&&aSpi<=95)?'Upright':'Adjust Posture';
  var conBadge = aConf!==null?(aConf>=7?'Strong':aConf>=5?'Moderate':'Developing'):'—';

  var isAI = (method==='ai');
  var mBg  = isAI?'rgba(52,211,153,0.12)':'rgba(251,191,36,0.12)';
  var mBrd = isAI?'rgba(52,211,153,0.3)':'rgba(251,191,36,0.3)';
  var mClr = isAI?'#34d399':'#fbbf24';
  var mLbl = isAI?'✦ OpenAI-Powered Analysis':'⚙ Rule-Based Analysis';

  var eyePct = Math.round(aEye*100);
  var shoPct = Math.max(0, Math.round(100 - Math.abs(aSho)*6));
  var spiPct = Math.min(100, Math.round((aSpi/90)*100));
  var conPct = aConf!==null ? Math.round(aConf*10) : 0;

  var h = '';
  h += '<div class="section-title"><span>🎥 Body Language Analysis</span><span class="line"></span></div>';
  h += '<div class="card card-accent-orange" style="margin-bottom:40px;">';
  h += '<div class="card-eyebrow">🎥 &nbsp;VIDEO BODY LANGUAGE REPORT</div>';

  // Method badge + frame count
  h += '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px;">';
  h += '<span style="display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;padding:4px 14px;border-radius:100px;background:'+mBg+';border:1px solid '+mBrd+';color:'+mClr+';">'+mLbl+'</span>';
  h += '<span style="font-family:var(--mono);font-size:12px;color:var(--dim);">'+cnt+' answer'+(cnt!==1?'s':'')+' analysed &nbsp;·&nbsp; '+totalFrames.toLocaleString()+' video frames processed</span>';
  h += '</div>';

  // ── 4 metric tiles
  h += '<div class="video-metric-grid">';

  h += '<div class="video-metric-tile" style="border-left:3px solid '+eyeC+';">';
  h += '<div class="video-metric-label">Avg Eye Contact</div>';
  h += '<div class="video-metric-value" style="color:'+eyeC+';">'+eyePct+'%</div>';
  h += '<div class="video-metric-bar"><div class="video-metric-bar-fill" style="width:'+eyePct+'%;background:'+eyeC+';"></div></div>';
  h += '<span class="tile-badge" style="background:'+eyeC+'22;color:'+eyeC+';border:1px solid '+eyeC+'44;">'+eyeBadge+'</span>';
  h += '<div class="video-metric-hint">Target: 70%+</div>';
  h += '</div>';

  h += '<div class="video-metric-tile" style="border-left:3px solid '+shoC+';">';
  h += '<div class="video-metric-label">Shoulder Alignment</div>';
  h += '<div class="video-metric-value" style="color:'+shoC+';">'+aSho.toFixed(1)+'°</div>';
  h += '<div class="video-metric-bar"><div class="video-metric-bar-fill" style="width:'+shoPct+'%;background:'+shoC+';"></div></div>';
  h += '<span class="tile-badge" style="background:'+shoC+'22;color:'+shoC+';border:1px solid '+shoC+'44;">'+shoBadge+'</span>';
  h += '<div class="video-metric-hint">Target: &lt;5° tilt</div>';
  h += '</div>';

  h += '<div class="video-metric-tile" style="border-left:3px solid '+spiC+';">';
  h += '<div class="video-metric-label">Spine / Posture</div>';
  h += '<div class="video-metric-value" style="color:'+spiC+';">'+aSpi.toFixed(1)+'°</div>';
  h += '<div class="video-metric-bar"><div class="video-metric-bar-fill" style="width:'+spiPct+'%;background:'+spiC+';"></div></div>';
  h += '<span class="tile-badge" style="background:'+spiC+'22;color:'+spiC+';border:1px solid '+spiC+'44;">'+spiBadge+'</span>';
  h += '<div class="video-metric-hint">Target: 75°–95°</div>';
  h += '</div>';

  if (aConf !== null) {
    h += '<div class="video-metric-tile" style="border-left:3px solid '+conC+';">';
    h += '<div class="video-metric-label">Confidence Score</div>';
    h += '<div class="video-metric-value" style="color:'+conC+';">'+aConf.toFixed(1)+'<span style="font-size:14px;font-weight:400;opacity:.6;">/10</span></div>';
    h += '<div class="video-metric-bar"><div class="video-metric-bar-fill" style="width:'+conPct+'%;background:'+conC+';"></div></div>';
    h += '<span class="tile-badge" style="background:'+conC+'22;color:'+conC+';border:1px solid '+conC+'44;">'+conBadge+'</span>';
    h += '<div class="video-metric-hint">Target: 7.0+</div>';
    h += '</div>';
  }

  h += '</div>'; // end video-metric-grid

  // ── Overall Assessment
  if (allOverall.length) {
    h += '<div class="section-block" style="border-left-color:#fb923c;margin-top:8px;">';
    h += '<div class="section-block-title" style="color:#fb923c;">📊 Overall Body Language Assessment</div>';
    h += '<div class="section-block-body">'+allOverall[0]+'</div>';
    h += '</div>';
  }

  // ── Eye Contact detail
  if (allEyeA.length) {
    var ea = allEyeA[0];
    var earating = ea.rating || '';
    var eaanalysis = ea.analysis || '';
    var eaC = earating==='Strong'?'#34d399':earating==='Moderate'?'#fbbf24':'#f87171';
    h += '<div class="section-block" style="border-left-color:'+eaC+';">';
    h += '<div class="section-block-title" style="color:'+eaC+';">👁️ Eye Contact — '+earating+'</div>';
    h += '<div class="section-block-body">'+eaanalysis+'</div>';
    h += '</div>';
  }

  // ── Posture detail
  if (allPostA.length) {
    var pa = allPostA[0];
    var parating = pa.rating || '';
    var paanalysis = pa.analysis || '';
    var paC = parating==='Good'?'#34d399':parating==='Moderate'?'#fbbf24':'#f87171';
    h += '<div class="section-block" style="border-left-color:'+paC+';">';
    h += '<div class="section-block-title" style="color:'+paC+';">🧍 Posture — '+parating+'</div>';
    h += '<div class="section-block-body">'+paanalysis+'</div>';
    h += '</div>';
  }

  // ── Strengths / Improvements / Recommendations in 3-col grid
  if (blStr.length || blImp.length || blRec.length) {
    h += '<div class="video-insights-grid">';
    if (blStr.length) {
      h += '<div class="video-insight-block" style="background:rgba(52,211,153,0.05);border:1px solid rgba(52,211,153,0.15);">';
      h += '<div class="video-insight-title" style="color:#34d399;">✅ Body Language Strengths</div>';
      h += blist(blStr.slice(0,5));
      h += '</div>';
    }
    if (blImp.length) {
      h += '<div class="video-insight-block" style="background:rgba(248,113,113,0.05);border:1px solid rgba(248,113,113,0.15);">';
      h += '<div class="video-insight-title" style="color:#f87171;">⚠️ Areas to Improve</div>';
      h += blist(blImp.slice(0,5));
      h += '</div>';
    }
    if (blRec.length) {
      h += '<div class="video-insight-block" style="background:rgba(251,146,60,0.05);border:1px solid rgba(251,146,60,0.15);">';
      h += '<div class="video-insight-title" style="color:#fb923c;">📈 Recommendations</div>';
      h += blist(blRec.slice(0,5));
      h += '</div>';
    }
    h += '</div>';
  }

  h += '</div>'; // end card
  return h;
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render() {
  var main = document.getElementById('reportMain');
  if (!answers.length) {
    main.innerHTML = '<div class="empty-state"><h2>No Interview Data Found</h2><p>No session data was found. Please complete an interview first.</p><a href="register.html" class="btn btn-primary" style="display:inline-flex;margin:16px auto 0;">Start Interview</a></div>';
    return;
  }

  var dateStr = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var h = '';

  // Hero
  h += '<div class="report-hero">';
  h += '<div class="report-tag">// InterviewAI · Full Candidate Report</div>';
  h += '<h1>Interview Report<br><em>'+candidateName+'</em></h1>';
  h += '<div class="candidate-meta">';
  h += '<span class="meta-pill">📧 '+candidateEmail+'</span>';
  h += '<span class="meta-pill">📅 '+dateStr+'</span>';
  h += '<span class="meta-pill">❓ '+answers.length+' / '+totalQuestions+' answered</span>';
  h += '<span class="meta-pill">📊 '+scored+' audio scored</span>';
  if (videoAnswers.length) h += '<span class="meta-pill">🎥 '+videoAnswers.length+' video analysed</span>';
  h += '</div></div>';

  // Overall banner
  h += '<div class="card card-accent-blue" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:36px;">';
  h += '<div>';
  h += '<div style="font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;">Overall Performance</div>';
  h += '<div style="font-family:var(--display);font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px;">'+ovBadge.l+' — '+avgO.toFixed(1)+' / 10</div>';
  h += '<div style="font-size:13px;color:var(--sub);">Across '+scored+' scored answer'+(scored!==1?'s':'')+' &nbsp;·&nbsp; '+avgW+' avg words &nbsp;·&nbsp; '+avgFil.toFixed(1)+'% avg filler rate</div>';
  h += '</div>';
  h += '<div class="overall-badge" style="background:'+ovBadge.c+'12;border:2px solid '+ovBadge.c+'44;">';
  h += '<div class="overall-score" style="color:'+ovBadge.c+';">'+avgO.toFixed(1)+'</div>';
  h += '<div class="overall-label" style="color:'+ovBadge.c+';">out of 10</div>';
  h += '<div class="overall-text" style="color:'+ovBadge.c+';">'+ovBadge.l+'</div>';
  h += '</div></div>';

  // Score tiles
  h += '<div class="section-title"><span>Performance Overview</span><span class="line"></span></div>';
  h += '<div class="overview-grid" style="margin-bottom:40px;">';
  h += tile('Avg Content',    avgC,   10, false, 'Answer relevance & depth');
  h += tile('Avg Tone',       avgT,   10, false, 'Vocal delivery & expression');
  h += tile('Avg Confidence', avgCon, 10, false, 'Composure & assurance');
  
  h += tile('Avg Filler %',   avgFil, 100, true, 'Lower is better');
  h += tile('Avg Fumble %',   avgFum, 20,  true, 'Lower is better');
  h += '</div>';

  // Metric table
  h += '<div class="section-title"><span>What Your Numbers Mean</span><span class="line"></span></div>';
  h += '<div class="card card-accent-blue" style="margin-bottom:40px;">';
  h += '<div class="card-eyebrow">📊 &nbsp;Metric-by-Metric Breakdown</div>';
  h += '<table class="metric-table">';
  h += '<tr><td><span class="metric-icon">📋</span> <span class="metric-label">Content Quality</span></td><td class="metric-value" style="color:'+rc(avgC,10)+';">'+avgC.toFixed(1)+'/10</td><td class="metric-interp">'+iContent(avgC)+'</td></tr>';
  h += '<tr style="background:rgba(255,255,255,0.015);"><td><span class="metric-icon">🎙️</span> <span class="metric-label">Vocal Tone</span></td><td class="metric-value" style="color:'+rc(avgT,10)+';">'+avgT.toFixed(1)+'/10</td><td class="metric-interp">'+iTone(avgT)+'</td></tr>';
  h += '<tr><td><span class="metric-icon">💪</span> <span class="metric-label">Confidence</span></td><td class="metric-value" style="color:'+rc(avgCon,10)+';">'+avgCon.toFixed(1)+'/10</td><td class="metric-interp">'+iConf(avgCon)+'</td></tr>';
  h += '<tr style="background:rgba(255,255,255,0.015);"><td><span class="metric-icon">🗣️</span> <span class="metric-label">Filler Words</span></td><td class="metric-value" style="color:'+rc(avgFil,100,true)+';">'+avgFil.toFixed(1)+'%</td><td class="metric-interp">'+iFill(avgFil)+'</td></tr>';
  h += '<tr><td><span class="metric-icon">🔁</span> <span class="metric-label">Fumbles/Repeats</span></td><td class="metric-value" style="color:'+rc(avgFum,20,true)+';">'+avgFum.toFixed(1)+'%</td><td class="metric-interp">'+iFumb(avgFum)+'</td></tr>';
  h += '<tr style="background:rgba(255,255,255,0.015);"><td><span class="metric-icon">📝</span> <span class="metric-label">Word Count</span></td><td class="metric-value" style="color:'+rc(avgW,100)+';">'+avgW+' words</td><td class="metric-interp">'+iWords(avgW)+'</td></tr>';
  h += '</table></div>';

  // Per-question breakdown
  h += '<div class="section-title"><span>Per-Question Breakdown</span><span class="line"></span></div>';
  h += '<div class="card card-accent-yellow" style="margin-bottom:40px;">';
  h += '<div class="card-eyebrow">❓ &nbsp;All Answers &amp; Scores</div>';

  for (var qi=0;qi<answers.length;qi++) {
    var item = answers[qi];
    var qs   = item.ai_score;
    var hasS = qs && !qs.error;
    var qva  = item.video_analysis;
    var hasV = qva && !qva.error && qva.raw_metrics;
    var lc   = hasS ? rc(qs.overall_score||0,10) : 'var(--dim)';

    h += '<div class="answer-item" style="border-left-color:'+lc+';">';
    h += '<div class="answer-q-label">Question '+(qi+1)+'</div>';
    h += '<div class="answer-q-text">'+(item.question||'—')+'</div>';
    h += '<div class="answer-a-text">'+(item.answer||'—')+'</div>';
    h += '<div class="answer-scores">';

    if (hasS) {
      var chips=[['Content',qs.content_score||0,10],['Tone',qs.tone_score||0,10],['Overall',qs.overall_score||0,10],['Confidence',qs.confidence_score||0,10]];
      for (var ci=0;ci<chips.length;ci++) {
        var cl=chips[ci][0],cv=chips[ci][1],cm=chips[ci][2],cc=rc(cv,cm);
        h += '<span class="score-chip" style="background:'+cc+'18;color:'+cc+';border:1px solid '+cc+'44;">'+cl+': '+cv.toFixed(1)+'/10</span>';
      }
      h += '<span class="score-chip" style="background:rgba(251,191,36,0.1);color:#fbbf24;border:1px solid rgba(251,191,36,0.3);">Filler: '+(qs.filler_word_rate||0).toFixed(1)+'%</span>';
      h += '<span class="score-chip" style="background:rgba(167,139,250,0.1);color:#a78bfa;border:1px solid rgba(167,139,250,0.3);">'+(qs.word_count||0)+' words</span>';
    } else {
      h += '<span style="font-size:12px;color:var(--dim);font-family:var(--mono);">No audio score</span>';
    }

    if (hasV) {
      var vep = Math.round((qva.raw_metrics.eye_contact_rate||0)*100);
      var vec = vep>=70?'#34d399':vep>=50?'#fbbf24':'#f87171';
      h += '<span class="score-chip" style="background:rgba(251,146,60,0.1);color:#fb923c;border:1px solid rgba(251,146,60,0.3);">👁 Eye: '+vep+'%</span>';
      if (qva.assessment && typeof qva.assessment.confidence_projection_score === 'number') {
        var vc = qva.assessment.confidence_projection_score;
        var vcc = vc>=7?'#34d399':vc>=5?'#fbbf24':'#f87171';
        h += '<span class="score-chip" style="background:'+vcc+'18;color:'+vcc+';border:1px solid '+vcc+'44;">🎥 Body Conf: '+vc.toFixed(1)+'/10</span>';
      }
    }

    h += '</div></div>'; // answer-scores + answer-item
  }
  h += '</div>'; // card

  // Strengths / Weaknesses
  if (allStr.length || allWeak.length) {
    h += '<div class="section-title"><span>Qualitative Insights</span><span class="line"></span></div>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:40px;">';
    if (allStr.length)  h += '<div class="card card-accent-green"><div class="card-eyebrow">✅ &nbsp;Key Strengths</div>'+blist(allStr.slice(0,6))+'</div>';
    if (allWeak.length) h += '<div class="card card-accent-blue" style="border-top-color:#f87171;"><div class="card-eyebrow">⚠️ &nbsp;Recurring Weak Spots</div>'+blist(allWeak.slice(0,6))+'</div>';
    h += '</div>';
  }
  if (allImpr.length) {
    h += '<div class="card card-accent-purple" style="margin-bottom:40px;">';
    h += '<div class="card-eyebrow">📈 &nbsp;Priority Improvement Areas</div>'+blist(allImpr.slice(0,6));
    h += '</div>';
  }

  // ── VIDEO SECTION injected here
  h += buildVideoSection();

  // Growth plan
  h += '<div class="section-title"><span>Your Personal Growth Plan</span><span class="line"></span></div>';
  h += '<div class="card card-accent-blue" style="border:1px solid rgba(56,189,248,0.2);background:linear-gradient(135deg,rgba(56,189,248,0.04) 0%,rgba(167,139,250,0.04) 100%);margin-bottom:40px;">';
  h += '<div class="card-eyebrow">🌱 &nbsp;Tailored Next Steps</div>';
  h += '<p style="font-size:14px;line-height:1.8;color:rgba(255,255,255,0.7);margin-bottom:20px;">First off — <strong style="color:#38bdf8;">thank you for completing this interview.</strong> It takes real courage to put yourself out there. Every session you do, whether it goes perfectly or not, is making you better.</p>';
  h += '<div class="growth-grid">';
  h += '<div class="growth-tile" style="background:rgba(52,211,153,0.06);border:1px solid rgba(52,211,153,0.18);"><div class="growth-tile-title" style="color:#34d399;">💪 Build Confidence</div>'+(avgCon>=7?"You already sound composed and confident — a real asset. Keep recording mock answers to maintain this level.":"Confidence comes from repetition. Answer one question out loud every day, then play it back. Hearing yourself improves awareness faster than anything.")+'</div>';
  h += '<div class="growth-tile" style="background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.18);"><div class="growth-tile-title" style="color:#fbbf24;">🗣️ Reduce Filler Words</div>'+(avgFil<5?"Your filler word control is excellent. Stay mindful when nerves kick in during real interviews.":"Write your answer before speaking. Reading it once organises your thought so fewer fillers creep in. A confident pause always beats an 'um'.")+'</div>';
  h += '<div class="growth-tile" style="background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.18);"><div class="growth-tile-title" style="color:#38bdf8;">📋 Structure Answers</div>'+(avgC>=7?"Your content is strong. End every answer with a clear conclusion to make it land even harder.":"Try the STAR method: Situation → Task → Action → Result. It keeps you on-topic and gives interviewers exactly what they need.")+'</div>';
  h += '<div class="growth-tile" style="background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.18);"><div class="growth-tile-title" style="color:#a78bfa;">🎙️ Tone &amp; Delivery</div>'+(avgT>=7?"Your delivery is clear and expressive. Slow down slightly on key points to let them land.":"Read a short passage aloud each morning focusing on pitch and pace variation. This trains your voice to sound more engaged naturally.")+'</div>';
  if (allStr[0]) h += '<div class="growth-tile" style="background:rgba(34,211,238,0.06);border:1px solid rgba(34,211,238,0.18);"><div class="growth-tile-title" style="color:#22d3ee;">⭐ Leverage Your Strength</div>One thing you clearly have: <em style="color:#22d3ee;">"'+allStr[0]+'"</em>. Lead with it in your opener and let it set the tone.</div>';
  if (allImpr[0]) h += '<div class="growth-tile" style="background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.18);"><div class="growth-tile-title" style="color:#f87171;">🎯 Your #1 Focus</div>If you could work on just one thing: <em style="color:#f87171;">"'+allImpr[0]+'"</em>. Practise one answer 5 times out loud — targeted repetition beats general effort every time.</div>';
  h += '</div>';
  h += '<div class="encourage-box"><strong style="color:var(--text);">Every great communicator started exactly where you are.</strong><br>The fact that you\'re practising with AI feedback puts you ahead of 90% of candidates. Keep recording, keep going — and <strong style="color:var(--accent);">you will see real improvement.</strong> 💙</div>';
  h += '</div>';

  // Footer
  h += '<div style="text-align:center;padding:20px 0;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:0.5px;">InterviewAI · Candidate Report · Generated '+dateStr+'</div>';

  main.innerHTML = h;

  // Animate all fill bars
  requestAnimationFrame(function(){
    document.querySelectorAll('.tile-bar-fill,.video-metric-bar-fill').forEach(function(el){
      var w=el.style.width; el.style.width='0%';
      requestAnimationFrame(function(){ el.style.width=w; });
    });
  });
}

render();
</script>
</body>
</html>
